	<body>

    <div id="app"></div>

    <!-- 点顶部 "Patterns" 标题返回拼豆应用：通知父页面关闭图纸视图 -->
    <script>
      (function () {
        var tries = 0;
        var timer = setInterval(function () {
          var h = document.querySelector('.ship-section__title') || document.querySelector('h2');
          if (h) {
            clearInterval(timer);
            h.style.cursor = 'pointer';
            h.title = '返回拼豆';
            h.addEventListener('mouseenter', function () { h.style.color = '#ffd166'; });
            h.addEventListener('mouseleave', function () { h.style.color = ''; });
            h.addEventListener('click', function () {
              window.parent.postMessage({ type: 'bead-close-cards' }, '*');
            });
          } else if (++tries > 100) {
            clearInterval(timer);
          }
        }, 120);
      })();
    </script>
